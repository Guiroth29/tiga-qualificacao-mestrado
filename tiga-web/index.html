<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TIGA — ficha de integração da IA no audiovisual</title>
  <meta name="description" content="Classifique o uso de inteligência artificial generativa no seu filme, série, clipe ou peça publicitária. Receba uma ficha com o perfil, os pontos de atenção e o que fazer sobre cada um.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230C1A20'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Archivo,sans-serif' font-size='11' font-weight='800' fill='%23EDF1F2'%3ETIGA%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip"></a>

  <header class="app-header">
    <div class="wrap">
      <button class="brand" type="button" data-go="home">
        <span class="brand-mark">TG</span>
        <span class="brand-text">
          <span class="brand-name" data-i18n="brand"></span>
          <span class="brand-sub" data-i18n="brandFull"></span>
        </span>
      </button>

      <nav class="header-nav" data-i18n-aria="navSections">
        <button type="button" data-go="home" data-hash="como" data-i18n="navHow"></button>
        <button type="button" data-go="history" data-i18n="navHistory"></button>
        <button type="button" data-go="glossary" data-i18n="navGlossary"></button>
        <button type="button" data-go="about" data-i18n="navAbout"></button>
      </nav>

      <div class="ctl-group">
        <label class="expert-toggle" title="" data-i18n-title="expertHint">
          <input type="checkbox" id="expert-toggle">
          <span class="expert-label" data-i18n="expertOn"></span>
        </label>
        <div class="lang-switch" role="group">
          <button type="button" class="flag-btn" data-lang="pt" aria-pressed="true" data-i18n-aria="langPt">
            <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="1" fill="#009B3A"/><polygon points="14,2.2 25.4,10 14,17.8 2.6,10" fill="#FEDD00"/><circle cx="14" cy="10" r="4.1" fill="#002776"/></svg>
          </button>
          <button type="button" class="flag-btn" data-lang="en" aria-pressed="false" data-i18n-aria="langEn">
            <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="1" fill="#012169"/><path d="M0 0l28 20M28 0L0 20" stroke="#fff" stroke-width="3.2"/><path d="M0 0l28 20M28 0L0 20" stroke="#C8102E" stroke-width="1.6"/><path d="M14 0v20M0 10h28" stroke="#fff" stroke-width="5.2"/><path d="M14 0v20M0 10h28" stroke="#C8102E" stroke-width="2.4"/></svg>
          </button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" data-i18n-aria="themeToggle">
          <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="view-home" class="view">
      <div class="wrap">
        <div class="hero">
          <div>
            <p class="eyebrow" data-i18n="heroEyebrow"></p>
            <h1 class="hero-title" data-i18n="heroTitle"></h1>
            <p class="hero-lead" data-i18n="heroLead"></p>
            <div class="hero-actions">
              <button type="button" class="btn btn-primary" data-go="form" data-i18n="heroCta"></button>
              <button type="button" class="btn btn-ghost" data-example="magicvfx" data-i18n="heroCta2"></button>
              <span class="hero-time" data-i18n="heroTime"></span>
            </div>
            <div class="pipeline-strip" id="pipeline-strip" aria-hidden="true"></div>
          </div>
          <aside class="sample-card" id="sample-card" aria-live="polite"></aside>
        </div>

        <section class="how" id="como">
          <p class="eyebrow" data-i18n="homeHow"></p>
          <h2 class="how-title" data-i18n="howTitle"></h2>
          <p class="how-lead" data-i18n="howLead"></p>
          <div class="how-grid" id="how-grid"></div>
          <div class="what-is">
            <h2 data-i18n="whatIsTitle"></h2>
            <p data-i18n="whatIsBody"></p>
          </div>
        </section>
      </div>
    </section>

    <section id="view-form" class="view" hidden>
      <div class="wrap form-shell">
        <nav class="stepper" aria-label="" data-i18n-aria="progress">
          <ol class="stepper-track" id="stepper"></ol>
          <p class="step-count" id="step-count"></p>
        </nav>
        <div id="form-root"></div>
      </div>
    </section>

    <section id="view-result" class="view" hidden>
      <div class="wrap" id="result-root"></div>
    </section>

    <section id="view-history" class="view" hidden>
      <div class="wrap">
        <div class="page-head">
          <p class="eyebrow" data-i18n="navHistory"></p>
          <h1 data-i18n="histTitle"></h1>
          <p class="lead" data-i18n="histLead"></p>
        </div>
        <div id="history-root"></div>
      </div>
    </section>

    <section id="view-glossary" class="view" hidden>
      <div class="wrap">
        <div class="page-head">
          <p class="eyebrow" data-i18n="navGlossary"></p>
          <h1 data-i18n="glossTitle"></h1>
          <p class="lead" data-i18n="glossLead"></p>
        </div>
        <dl class="gloss-list" id="gloss-list"></dl>
      </div>
    </section>

    <section id="view-about" class="view" hidden>
      <div class="wrap">
        <div class="page-head">
          <p class="eyebrow" data-i18n="navAbout"></p>
          <h1 data-i18n="aboutTitle"></h1>
        </div>
        <article class="about" id="about-root"></article>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="wrap">
      <div>
        <p class="mark">TIGA</p>
        <p data-i18n="footerCredit"></p>
      </div>
      <p data-i18n="footerNote"></p>
    </div>
  </footer>

  <noscript>
    <p style="padding:1.5rem;text-align:center">Esta ferramenta precisa de JavaScript para montar o formulário e calcular a ficha.</p>
  </noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
